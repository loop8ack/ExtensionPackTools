name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/Build.yml
    with:
      tag: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkup code
        uses: actions/checkout@v4.1.1

      - name: Download VSIX 2017
        uses: actions/download-artifact@v4.1.7
        with:
          name: ExtensionManager2017.vsix

      - name: Download VSIX 2019
        uses: actions/download-artifact@v4.1.7
        with:
          name: ExtensionManager2019.vsix

      - name: Download VSIX 2022
        uses: actions/download-artifact@v4.1.7
        with:
          name: ExtensionManager2022.vsix

      - name: Unzip VSIX Archives
        shell: pwsh
        run: |
          Get-ChildItem . -Filter *.zip | ForEach-Object {
            Expand-Archive -LiteralPath $_.FullName -DestinationPath .
          }

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }}

      - name: Upload Release Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} "ExtensionManager2017.vsix" "ExtensionManager2019.vsix" "ExtensionManager2022.vsix"
